AWSTemplateFormatVersion: '2010-09-09'
Description: 'CI/CD Phase: Production-ready Static Website Hosting on AWS S3'

# NOTE: BucketPolicy is intentionally excluded from this template.
# AWS EarlyValidation hook blocks CloudFormation from deploying Principal: '*' policies.
# The public read policy is applied as a separate step in the GitHub Actions workflow.

Parameters:
  BucketName:
    Type: String
    Description: 'The globally unique name for your static website S3 bucket'
    Default: 'my-african-restaurant-site-932877337538'

Resources:
  # Block A: Provisions the base S3 Bucket container
  StaticWebsiteBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref BucketName
      # Block B: Overrides global S3 blocks to allow policy-based public access
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      # Block C: Turns the bucket into an active web routing engine
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      Tags:
        - Key: Name
          Value: 'African Restaurant Web Hoster'
        - Key: Environment
          Value: 'Production'

Outputs:
  WebsiteURL:
    Description: 'The live public HTTP URL of your deployed static website'
    Value: !GetAtt StaticWebsiteBucket.WebsiteURL
