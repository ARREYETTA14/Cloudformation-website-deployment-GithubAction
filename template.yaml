AWSTemplateFormatVersion: '2010-09-09'
Description: 'CI/CD Phase: Production-ready Static Website Hosting on AWS S3'

# NOTE: The BucketPolicy (public read access) is intentionally excluded from this template.
# AWS::EarlyValidation::PropertyValidation hook blocks CloudFormation from deploying any
# bucket policy with Principal: '*'. The public read policy is therefore applied as a
# separate step inside the GitHub Actions workflow after the stack is created.

Parameters:
  BucketName:
    Type: String
    Description: 'The globally unique name for your static website S3 bucket'
    Default: 'your-unique-bucket-name' # 🚨 SUBSTITUTE: Replace with your own globally unique S3 bucket name
                                        # Example: 'my-portfolio-site-123456789012'
                                        # Rules: lowercase only, no spaces, globally unique across all AWS accounts

Resources:
  # Block A: Provisions the base S3 Bucket container
  StaticWebsiteBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref BucketName
      # Block B: Overrides global S3 blocks to allow policy-based public access
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      # Block C: Turns the bucket into an active web routing engine
      WebsiteConfiguration:
        IndexDocument: index.html  # SUBSTITUTE: Replace if your main page has a different filename
        ErrorDocument: error.html  # SUBSTITUTE: Replace if your error page has a different filename
      Tags:
        - Key: Name
          Value: 'your-project-name'  # SUBSTITUTE: Replace with a descriptive name for your project
        - Key: Environment
          Value: 'Production'         # SUBSTITUTE: Replace with your environment e.g. 'Staging', 'Dev'

Outputs:
  WebsiteURL:
    Description: 'The live public HTTP URL of your deployed static website'
    Value: !GetAtt StaticWebsiteBucket.WebsiteURL
